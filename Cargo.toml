[package]
name = "gold-ticker"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "A native macOS Menu Bar app for displaying Tencent hf_XAU gold quotes."
license = "MIT"
readme = "README.md"
repository = "https://github.com/zkh110119/gold-ticker"
homepage = "https://github.com/zkh110119/gold-ticker"
keywords = ["macos", "menu-bar", "gold", "quote"]
categories = ["command-line-utilities"]

[dependencies]
block2 = "=0.6.2"
directories = "=6.0.0"
encoding_rs = "=0.8.40"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = [
    "NSButton",
    "NSButtonCell",
    "NSCell",
    "NSControl",
    "NSApplication",
    "NSAppearance",
    "NSMenu",
    "NSMenuItem",
    "NSEvent",
    "NSResponder",
    "NSPopover",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSTextField",
    "NSView",
    "NSViewController",
] }
objc2-foundation = { version = "=0.3.2", features = [
    "NSDate",
    "NSGeometry",
    "NSBundle",
    "NSObject",
    "NSString",
    "NSTimer",
] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = [
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
rust_decimal = { version = "=1.43.0", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
