name: Bug report
description: Report a reproducible problem with Gold Ticker.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Gold Ticker. Do not include API keys, credentials, personal data, quote caches, or diagnostic logs containing sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence of actions.
      placeholder: |
        1. Launch Gold Ticker
        2. Open the menu bar popover
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Gold Ticker version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: textarea
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.0"
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include only non-sensitive screenshots or details that help reproduce the problem.
