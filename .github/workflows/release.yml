name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build and publish release
    runs-on: macos-14
    environment: release
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [[ -n "$package_version" ]] || { echo "Cargo.toml version is missing" >&2; exit 1; }
          [[ "$tag_version" == "$package_version" ]] || {
            echo "Tag version $tag_version does not match Cargo.toml version $package_version" >&2
            exit 1
          }
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "Release must run from a tag" >&2; exit 1; }

      - name: Run quality checks
        run: |
          cargo fmt --check
          cargo test
          cargo clippy --all-targets -- -D warnings
          cargo build --release

      - name: Build and verify release artifacts
        run: ./packaging/build-app.sh

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          architecture="$(uname -m)"
          dmg="dist/GoldTicker-${version}-${architecture}.dmg"
          checksum="${dmg}.sha256"
          app="dist/GoldTicker.app"
          [[ -d "$app" ]] || { echo "Missing app bundle: $app" >&2; exit 1; }
          [[ -f "$dmg" ]] || { echo "Missing DMG: $dmg" >&2; exit 1; }
          [[ -f "$checksum" ]] || { echo "Missing checksum: $checksum" >&2; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          [[ "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" == "$version" ]]
          [[ -x "$app/Contents/MacOS/gold-ticker" ]]
          hdiutil verify "$dmg"
          (cd dist && shasum -a 256 -c "$(basename "$checksum")")
          while IFS= read -r path; do
            name="$(basename "$path")"
            [[ "$name" == "GoldTicker.app" || "$name" == "$(basename "$dmg")" || "$name" == "$(basename "$checksum")" ]] || {
              echo "Unexpected file in dist: $path" >&2
              exit 1
            }
          done < <(find dist -mindepth 1 -maxdepth 1 -print)

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          architecture="$(uname -m)"
          sed \
            -e "s/<version>/${version}/g" \
            -e "s/<architecture>/${architecture}/g" \
            .github/release-template.md > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          architecture="$(uname -m)"
          dmg="dist/GoldTicker-${version}-${architecture}.dmg"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gold Ticker v${version}" \
            --notes-file dist/release-notes.md \
            "$dmg" \
            "${dmg}.sha256"
